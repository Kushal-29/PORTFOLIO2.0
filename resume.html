<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUSHAL K — Official ATS Resume PDF</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #09090b;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: 64px;
      background: #121216;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 10;
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 99px;
      color: #a1a1aa;
    }

    .btn-download {
      padding: 10px 22px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .btn-download:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-1px);
    }

    .pdf-viewer-frame {
      flex: 1;
      width: 100%;
      height: calc(100vh - 64px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-title">
      <span>KUSHAL K</span>
      <span class="status-pill">Official ATS Resume PDF</span>
    </div>
    <a href="Kushal_K_Resume.pdf" download="Kushal_K_Resume.pdf" class="btn-download">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>Download ATS Resume (PDF)</span>
    </a>
  </div>

  <iframe src="Kushal_K_Resume.pdf#toolbar=1" class="pdf-viewer-frame" title="Kushal K Resume PDF"></iframe>

</body>
</html>
